server {
    listen 80;
    listen [::]:80;
    server_name zipplz.xyz www.zipplz.xyz;

    # HTTP에서 HTTPS로 리디렉션
    location / {
        return 301 https://zipplz.xyz$request_uri;
    }
}

# HTTPS www 요청은 zipplz.xyz로 리디렉트
server {
    listen 443 ssl;
    server_name www.zipplz.xyz;

    ssl_certificate /etc/letsencrypt/live/www.zipplz.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zipplz.xyz/privkey.pem;

    return 301 https://zipplz.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zipplz.xyz;

    # SSL 설정
    ssl_certificate /etc/letsencrypt/live/www.zipplz.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zipplz.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    
    client_max_body_size 100M;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
		    
        # SPA 새로고침 처리
        try_files $uri $uri/ /index.html =404;
        
        # CORS 공통 설정
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Origin, Authorization, Accept, Content-Type, X-Requested-With';
    
    }

    # Backend API 프록시
    location /api {
        proxy_pass http://zipplz-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # wss(web-socket) 설정
        proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

        # OPTIONS 메소드에 대한 프리플라이트 요청 처리
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # OpenVidu 프록시
    location /openvidu/ {
        proxy_pass http//openvidu:4443/;  # Docker Compose 내부 서비스 이름

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OPTIONS 프리플라이트
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

    }
}