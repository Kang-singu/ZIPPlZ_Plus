services:
  # 원래는 ZIPPlZ-Plus-mysql 단락을 구성해야 하지만 이번에는 H2를 사용하므로 패스

  zipplz-backend:
    container_name: zipplz-backend
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - redis
    environment:
      - SPRING_H2_CONSOLE_ENABLED=true
      - SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS=true
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/zipplz;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
      - SPRING_H2_CONSOLE_PATH=${spring_h2_console_path}
      - SPRING_DATASOURCE_USERNAME=${spring_datasource_username}
      - SPRING_DATASOURCE_PASSWORD=${spring_datasource_password}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.H2Dialect

      - OPENVIDU_URL=${OPENVIDU_URL}
      - OPENVIDU_SECRET=${OPENVIDU_SECRET}
      - spring_jwt_secret=${spring_jwt_secret}
      - spring_security_oauth2_client_registration_google_client_id=${spring_security_oauth2_client_registration_google_client_id}
      - spring_security_oauth2_client_registration_google_client_secret=${spring_security_oauth2_client_registration_google_client_secret}
      - spring_security_oauth2_client_registration_google_redirect_uri=${spring_security_oauth2_client_registration_google_redirect_uri}
      - spring_security_oauth2_client_registration_kakao_client_id=${spring_security_oauth2_client_registration_kakao_client_id}
      - spring_security_oauth2_client_registration_kakao_client_secret=${spring_security_oauth2_client_registration_kakao_client_secret}
      - spring_security_oauth2_client_registration_kakao_redirect_uri=${spring_security_oauth2_client_registration_kakao_redirect_uri}
      - spring_data_mongodb_uri=${spring_data_mongodb_uri}
      - cloud_aws_credentials_accessKey=${cloud_aws_credentials_accessKey}
      - cloud_aws_credentials_secretKey=${cloud_aws_credentials_secretKey}
      - openai_api_key=${openai_api_key}

      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - TZ=Asia/Seoul

    volumes:
      - h2-data:/app/data
    networks:
      - spring-cloud-network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - spring-cloud-network

volumes:
  h2-data:
    driver: local

networks:
  spring-cloud-network:
    external: true
    name: zipplz-network
    driver: bridge
