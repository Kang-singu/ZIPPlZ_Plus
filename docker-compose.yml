services:
  zipplz-frontend:
    user: root
    container_name: zipplz-frontend
    build: ./frontend
    image: zipplz/zipplz-frontend
    restart: on-failure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt/live/www.zipplz.xyz:/etc/letsencrypt/live/www.zipplz.xyz
      - /etc/letsencrypt/archive/www.zipplz.xyz:/etc/letsencrypt/archive/www.zipplz.xyz
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./webroot:/usr/share/nginx/html/.well-known/acme-challenge
    environment:
      TZ: Asia/Seoul
